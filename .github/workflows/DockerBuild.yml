name: Docker

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 16 * * 1"
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - debian-custom/**
  # pull_request:
  #   paths:
  #     - debian-custom/**

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker build
    uses: Docker-Collection/reusable-workflows/.github/workflows/docker-build.yml@22410d20d42a7addaffe6fe5cc037653aae97e64 # main
    with:
      docker_name: "ghcr.io/docker-collection/debian-custom"
      context: "debian-custom/"
      dockerfile: "debian-custom/Dockerfile"
      docker_label_author: "Efina"
      docker_label_title: "Custom Debian Custom"
      docker_label_description: "Custom Debina installer for GitHub Action"
